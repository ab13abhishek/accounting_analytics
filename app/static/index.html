<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounting Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-mark">A</div>
        <button class="sidebar-item" data-route="overview" title="Overview">
          <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="17" rx="1"/></svg>
          <span class="sb-label">Overview</span>
        </button>
        <button class="sidebar-item" data-route="companies" title="Companies">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/></svg>
          <span class="sb-label">Companies</span>
        </button>
        <div class="sidebar-divider"></div>
      </div>
      <div class="sidebar-bottom">
        <button class="sidebar-item" id="sbNewCo" title="New company">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <span class="sb-label">New</span>
        </button>
        <button class="sidebar-item" id="themeToggle" title="Toggle theme">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.4 5.4 0 0 1 12 3z"/></svg>
          <span class="sb-label">Theme</span>
        </button>
      </div>
    </aside>

    <div class="shell-main">
      <header class="topbar2">
        <div class="crumb">
          <span class="name" id="crumbName">Overview</span>
          <span class="tag">Journal &rarr; Ledger &rarr; TB &rarr; P&amp;L &rarr; BS</span>
        </div>
        <div class="topbar2-actions" id="topbarActions"></div>
      </header>
      <div class="body-row">
        <main id="app"></main>
        <aside class="filterpane" id="filterPane" hidden></aside>
      </div>
    </div>
  </div>

  <template id="tpl-modal-newco">
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h3>New company</h3>
        <div class="field">
          <label for="ncName">Business name</label>
          <input class="input" id="ncName" type="text" placeholder="e.g. Bluepeak Consulting">
        </div>
        <div class="field">
          <label for="ncIndustry">Industry</label>
          <input class="input" id="ncIndustry" type="text" placeholder="e.g. Management Consulting">
        </div>
        <div class="field">
          <label for="ncCategory">Category</label>
          <select class="select" id="ncCategory">
            <option>Month-End Processing &amp; Management Reports</option>
            <option>Accounts Receivable &amp; Payable / Invoice Processing</option>
            <option>Daily Transaction Recording</option>
            <option>GST Reconciliation / BAS Preparation</option>
            <option selected>Custom</option>
          </select>
        </div>
        <div class="form-error" id="ncError" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn ghost" id="ncCancel">Cancel</button>
          <button class="btn primary" id="ncCreate">Create company</button>
        </div>
      </div>
    </div>
  </template>

  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
